spring:
  application:
    name: rent-flow-inventory
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    create-schemas: false
    default-schema: inventory
    schemas: inventory
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: inventory
  sql:
    init:
      mode: never

springdoc:
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never

spring:
  main:
    banner-mode: "off"
  application:
    name: rent-flow-inventory
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    create-schemas: false
    default-schema: inventory
    schemas: inventory
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: inventory
  sql:
    init:
      mode: never
  task:
    scheduling:
      pool:
        size: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${INVENTORY_CANCELLATION_GROUP_ID:rentflow.inventory.reservation-cancellation.v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
    listener:
      observation-enabled: true
      ack-mode: record
      concurrency: ${INVENTORY_CANCELLATION_CONCURRENCY:3}
      missing-topics-fatal: false
    template:
      observation-enabled: true

inventory:
  kafka:
    cluster-id: ${INVENTORY_KAFKA_CLUSTER_ID:}
    reservation-cancellation:
      topic: ${INVENTORY_CANCELLATION_TOPIC:rentflow.reservation.cancelled.v1}
      dead-letter-topic: ${INVENTORY_CANCELLATION_DLT:rentflow.inventory.reservation-cancellation.dlt.v1}
      max-payload-bytes: ${INVENTORY_CANCELLATION_MAX_PAYLOAD_BYTES:4096}
      retry:
        max-attempts: ${INVENTORY_CANCELLATION_MAX_ATTEMPTS:5}
        initial-backoff: ${INVENTORY_CANCELLATION_INITIAL_BACKOFF:1s}
        multiplier: ${INVENTORY_CANCELLATION_BACKOFF_MULTIPLIER:2}
        max-backoff: ${INVENTORY_CANCELLATION_MAX_BACKOFF:8s}

springdoc:
  paths-to-match: /api/v1/**

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8085}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  metrics:
    tags:
      service: ${spring.application.name}
      environment: ${OBSERVABILITY_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        inventory.status.transition: true
        inventory.status.transition.batch.size: false
        inventory.reservation.cancellation.completion.delay: true
      minimum-expected-value:
        http.server.requests: 1ms
        inventory.reservation.cancellation.completion.delay: 1ms
      maximum-expected-value:
        http.server.requests: 10s
        inventory.reservation.cancellation.completion.delay: 7d
  tracing:
    propagation:
      type: w3c
    baggage:
      enabled: false
    sampling:
      # reduce it later with the growing amount of requests
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment.name: ${OBSERVABILITY_ENVIRONMENT:local}
      service.instance.id: ${OBSERVABILITY_INSTANCE:${HOSTNAME:standalone}}
    tracing:
      export:
        max-queue-size: 2048
        max-batch-size: 512
        otlp:
          transport: http
          endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          connect-timeout: 2s
          timeout: 2s
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never

logging:
  level:
    org.apache.kafka.clients.consumer.ConsumerConfig: warn
    org.apache.kafka.clients.producer.ProducerConfig: warn
    org.apache.kafka.clients.admin.AdminClientConfig: warn
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: ${OBSERVABILITY_ENVIRONMENT:local}
        node-name: ${OBSERVABILITY_INSTANCE:${HOSTNAME:standalone}}
    json:
      stacktrace:
        max-length: 16384
        max-throwable-depth: 64

jdbc:
  includes: connection,query
  hikari:
    enabled: false
  resultset-operations:
    enabled: false
  datasource-proxy:
    include-parameter-values: false
    query:
      enable-logging: false
    slow-query:
      enable-logging: false

---
spring:
  config:
    activate:
      on-profile: local
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

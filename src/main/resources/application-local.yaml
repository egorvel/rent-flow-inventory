spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.rentflow.test:8180/realms/rentflow-local
          jwk-set-uri: http://auth.rentflow.test:8180/realms/rentflow-local/protocol/openid-connect/certs

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    oauth:
      client-id: inventory-swagger
      use-pkce-with-authorization-code-grant: true
      scopes: openid
    persist-authorization: false
